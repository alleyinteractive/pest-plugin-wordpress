name: "All Pull Request Tests"

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
    branches:
      - main
      - '*.x'
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # We use a single job to ensure that all steps run in the same environment and
  # reduce the number of minutes used.
  pr-tests:
    # Don't run on draft PRs
    if: github.event.pull_request.draft == false
    # Timeout after 10 minutes
    timeout-minutes: 10
    # Define a matrix of PHP/WordPress versions to test against
    strategy:
      fail-fast: false
      matrix:
        dependency-version: [prefer-stable] # TODO: Add prefer-lowest back here.
        php: [8.3, 8.4]
        pest: [4, 5]
        wordpress: ["latest"]
        exclude:
          # Pest 5 requires PHP ^8.4.
          - php: 8.3
            pest: 5
    runs-on: ubuntu-latest
    # Cancel any existing runs of this workflow
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-P${{ matrix.php }}-PEST${{ matrix.pest }}-WP${{ matrix.wordpress }}
      cancel-in-progress: true
    # Name the job in the matrix
    name: "PR Tests PHP ${{ matrix.php }} Pest ${{ matrix.pest }} WordPress ${{ matrix.wordpress }}"
    steps:
      - uses: actions/checkout@v7

      - name: Run General Tests
        # See https://github.com/alleyinteractive/action-test-general for more options
        uses: alleyinteractive/action-test-general@develop

      - name: Run PHP Tests
        # See https://github.com/alleyinteractive/action-test-php for more options
        uses: alleyinteractive/action-test-php@develop
        with:
          # pest-dev-tools isn't used by test:unit, and pinning it to the matrix
          # Pest version conflicts with mantle-framework's dependencies, so drop
          # it from this install entirely.
          install-command: >
            composer remove pestphp/pest-dev-tools --dev --no-update &&
            composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress
            --with pestphp/pest:^${{ matrix.pest }}
            --with pestphp/pest-plugin:^${{ matrix.pest }}
          php-version: '${{ matrix.php }}'
          skip-wordpress-install: 'true'
          test-command: 'composer test:unit'
          wordpress-version: '${{ matrix.wordpress }}'

  # This required job ensures that all PR checks have passed before merging.
  all-pr-checks-passed:
    name: All PR checks passed
    needs:
      - pr-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job statuses
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs were cancelled"
            exit 1
          else
            echo "All jobs passed or were skipped"
            exit 0
          fi
